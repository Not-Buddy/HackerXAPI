[package]
name = "ragx"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream", "__tls"] }
pdf-extract = "0.7"
lopdf = "0.32"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.98"
thiserror = "2"
async-trait = "0.1"
dotenvy = "0.15"
regex = "1.11.1"
chrono = "0.4"
rayon = "1.5"
futures = "0.3"
url = "2.5.4"
num_cpus = "1.16"
once_cell = "1.19"
calamine = "0.22"
zip = "0.6"
quick-xml = "0.31"
libc = "0.2"
docx-lite = "0.2"
image = "0.25"
qdrant-client = "1"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
ocrs = "0"
rten = "0"
aws-sdk-s3 = "1"
aws-config = "1"
mime_guess = "2"
rustls = "0.23"

